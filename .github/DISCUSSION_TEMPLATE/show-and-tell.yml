title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Show how you run finstats: a setup, a reverse-proxy config, a dashboard on a wall, something you learned about
        your server from it. Other people's setups are the best documentation.

        **Screenshots show what named people watched.** Blur user names, titles, device names and IP addresses, or use
        a test server. Posts with other people's viewing data get edited or removed (see the code of conduct).
  - type: textarea
    id: what
    attributes:
      label: What are you showing?
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: The setup
      description: Hardware, how finstats and Jellyfin run, proxy, anything that took you a while to get right.
  - type: textarea
    id: config
    attributes:
      label: Config worth sharing
      description: Compose file, proxy snippet. Remove domains, keys and addresses.
      render: yaml
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you post
      options:
        - label: Nothing in this post shows what real people watched, their names, devices or IP addresses
          required: true
