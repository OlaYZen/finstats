name: Bug report
description: Something does not work, shows the wrong numbers, or looks broken
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. **Before you paste anything:** logs and screenshots contain the user names, titles,
        device names and IP addresses of the people on your server. Blur or replace them. **Never attach** `finstats.db`,
        a finstats backup or a Jellystat export: each is a complete viewing history, and the database contains your
        Jellyfin API key. Security problems do not belong here: see the security policy.
  - type: input
    id: version
    attributes:
      label: finstats version
      description: Bottom right of every page, or the Patch notes tab.
      placeholder: "1.0.1"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options:
        - "Docker image :latest"
        - "Docker image, a pinned version"
        - "Docker image :edge"
        - "Docker image I built myself"
        - "From source (cargo)"
    validations:
      required: true
  - type: input
    id: jellyfin
    attributes:
      label: Jellyfin version
      description: Jellyfin Dashboard, or finstats → Server.
      placeholder: "10.11.0"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Where does it run?
      description: Hardware and OS, and anything unusual - a NAS, ARM, rootless Docker or Podman, a reverse proxy.
      placeholder: "Debian 13 on amd64, Docker 28, behind Caddy"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shorter, the faster it gets fixed. "Always" or "once" is useful too.
      placeholder: |
        1. Open Activity
        2. Sort by Progress
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: "`docker logs finstats` around the moment it went wrong. For more detail, start with `-e RUST_LOG=finstats=debug`. Remove names and addresses first."
      render: text
  - type: input
    id: browser
    attributes:
      label: Browser, if it is about the web UI
      placeholder: "Firefox 140 on Linux"
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I removed user names, titles, device names and IP addresses from what I pasted, and attached no database, backup or export
          required: true
        - label: I checked that this still happens on the latest version
          required: false
