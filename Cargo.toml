[package]
name = "finstats"
version = "0.6.0"
edition = "2024"
description = "Lightweight playback statistics for Jellyfin"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
futures-util = { version = "0.3", default-features = false }
hex = "0.4"
mime_guess = "2"
r2d2 = "0.8"
r2d2_sqlite = { version = "0.35", features = ["bundled"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "time", "sync", "io-util"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
