[package]
name = "finstats"
version = "1.6.3"
edition = "2024"
description = "Lightweight playback statistics for Jellyfin"
license = "GPL-3.0-only"
repository = "https://github.com/OlaYZen/finstats"
homepage = "https://github.com/OlaYZen/finstats"
readme = "README.md"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
futures-util = { version = "0.3", default-features = false }
hex = "0.4"
mime_guess = "2"
r2d2 = "0.8"
r2d2_sqlite = { version = "0.35", features = ["bundled"] }
rand = "0.9"
# gzip + brotli: every read asks for `Accept-Encoding: gzip, br` and is decoded transparently. Jellyfin,
# Sonarr, Radarr and Seerr all answer JSON, which is most of what finstats ever reads.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "time", "sync", "io-util"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
maxminddb = { version = "0.32.0", features = ["mmap"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
