services:
  finstats:
    image: ghcr.io/olayzen/finstats:latest
    # Building from source instead? Comment the line above out and use:
    # build: .
    container_name: finstats
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Used for "plays per day" and the hour-of-day heatmap.
      TZ: Europe/London
      # The user finstats runs as and that owns ./data. Change it if your files belong to someone else.
      # PUID: "1000"
      # PGID: "1000"
      # Behind a reverse proxy? Let finstats read the real client address.
      # FINSTATS_TRUST_PROXY: "1"
      # Optional: skip the setup wizard.
      # JELLYFIN_URL: http://jellyfin:8096
      # JELLYFIN_API_KEY: your-api-key
    volumes:
      - ./data:/data
